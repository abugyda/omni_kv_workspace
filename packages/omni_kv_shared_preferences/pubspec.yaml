resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  omni_kv: ^0.2.0
  shared_preferences: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  omni_kv_testing: ^0.2.0
  shared_preferences_platform_interface: any
  test: any
  very_good_analysis: any
