name: omni_kv_shared_preferences
description: SharedPreferences adapter for the OmniKV framework.
version: 0.2.0

homepage: https://github.com/puntbyte/omni_kv_workspace
repository: https://github.com/puntbyte/omni_kv_workspace/tree/main/packages/omni_kv_shared_preferences
issue_tracker: https://github.com/puntbyte/omni_kv_workspace/issues
documentation: https://docs.abugyda.com/omni-kv/adapters/shared-preferences

topics:
  - shared-preferences
  - key-value
  - storage
  - preferences

environment:
